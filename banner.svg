<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
<style>
.scan { animation: scan 4s ease-in-out infinite; }
@keyframes scan { 0% { transform: translateY(0); } 50% { transform: translateY(180px); } 100% { transform: translateY(0); } }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pulse { animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
.spin { animation: spin 45s linear infinite; transform-origin: 940px 160px; }
@keyframes spin { to { transform: rotate(360deg); } }
.flow { stroke-dasharray: 6 4; animation: flowDash 20s linear infinite; }
@keyframes flowDash { to { stroke-dashoffset: -200; } }
</style>
<defs>
  <clipPath id="card">
    <rect width="1200" height="320" rx="18"/>
  </clipPath>
  <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0.3"/>
  </linearGradient>
  <linearGradient id="glowGrad" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#818CF8"/>
  </linearGradient>
</defs>

<g clip-path="url(#card)">
  <!-- Background -->
  <rect width="1200" height="320" fill="#0A0F1D"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#14213D" stroke-width="1" opacity="0.8">
    <line x1="40" y1="0" x2="40" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="280" y1="0" x2="280" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="440" y1="0" x2="440" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="520" y1="0" x2="520" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="680" y1="0" x2="680" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="760" y1="0" x2="760" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="840" y1="0" x2="840" y2="320"/>
    <line x1="880" y1="0" x2="880" y2="320"/>
    <line x1="920" y1="0" x2="920" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/>
    <line x1="1080" y1="0" x2="1080" y2="320"/>
    <line x1="1120" y1="0" x2="1120" y2="320"/>
    <line x1="1160" y1="0" x2="1160" y2="320"/>

    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- Left Side Content -->
  <text x="70" y="85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#38BDF8" font-weight="600">$ whoami</text>
  
  <text x="68" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Zohair Maken</text>
  
  <text x="70" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#E2E8F0">AI &amp; MLOps Engineer<tspan fill="#64748B">  /  </tspan>Deep Learning<tspan fill="#64748B">  /  </tspan>Intelligent Systems</text>
  
  <text x="70" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">Building production-ready AI platforms, automated ML pipelines &amp; vision models</text>
  
  <text x="70" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#38BDF8">&gt; status: open to AI, ML &amp; Software Engineering roles</text>
  <rect class="blink" x="515" y="246" width="9" height="15" fill="#38BDF8"/>

  <!-- Right Side Visual / Telemetry Architecture Box -->
  <g>
    <!-- Outer Telemetry Reticle -->
    <path d="M 790 70 V 46 H 814" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <path d="M 1070 70 V 46 H 1046" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <path d="M 790 250 V 274 H 814" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <path d="M 1070 250 V 274 H 1046" fill="none" stroke="#38BDF8" stroke-width="2.5"/>

    <!-- Telemetry Status Tag -->
    <rect x="790" y="18" width="168" height="22" rx="4" fill="#0EA5E9" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="802" cy="29" r="4" fill="#10B981"/>
    <text x="814" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">SYSTEM: ACTIVE</text>

    <!-- Scan Line Effect -->
    <g class="scan">
      <rect x="792" y="48" width="276" height="30" fill="url(#fade)"/>
      <line x1="792" y1="78" x2="1068" y2="78" stroke="#38BDF8" stroke-width="1.5"/>
    </g>

    <!-- Pipeline / Neural Graphic Diagram -->
    <g class="spin" opacity="0.6">
      <circle cx="940" cy="160" r="85" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="940" cy="160" r="60" fill="none" stroke="#334155" stroke-width="1.5"/>
      <circle cx="940" cy="160" r="30" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2 3"/>
      
      <!-- Orbital Nodes -->
      <circle cx="940" cy="75" r="4" fill="#38BDF8"/>
      <circle cx="1025" cy="160" r="3" fill="#818CF8"/>
      <circle cx="940" cy="245" r="4" fill="#10B981"/>
      <circle cx="855" cy="160" r="3" fill="#F59E0B"/>
    </g>

    <!-- Central Core Node -->
    <circle cx="940" cy="160" r="8" fill="url(#glowGrad)"/>
    <circle cx="940" cy="160" r="16" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.4"/>

    <!-- Telemetry Status Indicators on the side -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <text class="pulse" style="animation-delay:0.0s" x="1088" y="105" fill="#94A3B8">LECTRA-AI  <tspan fill="#10B981">LIVE</tspan></text>
      <text class="pulse" style="animation-delay:0.4s" x="1088" y="133" fill="#94A3B8">NIDS_MODEL <tspan fill="#10B981">98.4%</tspan></text>
      <text class="pulse" style="animation-delay:0.8s" x="1088" y="161" fill="#94A3B8">MLFLOW_EXP <tspan fill="#38BDF8">TRACK</tspan></text>
      <text class="pulse" style="animation-delay:1.2s" x="1088" y="189" fill="#94A3B8">DOCKER_API <tspan fill="#818CF8">READY</tspan></text>
      <text class="pulse" style="animation-delay:1.6s" x="1088" y="217" fill="#94A3B8">CNN_VISION <tspan fill="#10B981">OPTIM</tspan></text>
    </g>
  </g>
</g>
</svg>
